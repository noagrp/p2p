<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple P2P Transfer</title>
    <style>
        body { font-family: monospace; background: #000; color: #0f0; padding: 20px; }
        textarea { width: 100%; height: 150px; background: #111; color: #0f0; border: 1px solid #0f0; padding: 10px; }
        button { padding: 15px; background: #111; color: #0f0; border: 1px solid #0f0; margin: 10px 0; font-size: 16px; }
    </style>
</head>
<body>
    <h1>Simple P2P File Transfer</h1>

    <div>
        <h2>Device A (Start Here)</h2>
        <button onclick="startA()">1. Create Code</button>
        <textarea id="codeA" placeholder="Code for B will appear here"></textarea>
    </div>

    <div>
        <h2>Device B</h2>
        <textarea id="inputB" placeholder="Paste code from A here"></textarea>
        <button onclick="startB()">2. Connect & Create Reply</button>
        <textarea id="codeB" placeholder="Reply code for A"></textarea>
    </div>

    <div>
        <h2>Device A Final Step</h2>
        <textarea id="finalInput" placeholder="Paste reply from B here"></textarea>
        <button onclick="finalConnect()">3. Final Connect</button>
    </div>

    <div>
        <h2>Send File</h2>
        <input type="file" id="file" multiple>
        <button onclick="send()">Send</button>
    </div>

    <div id="status">Status: Ready</div>

    <script src="https://unpkg.com/simple-peer@9/simplepeer.min.js"></script>
    <script>
        let peer = null;

        function startA() {
            peer = new SimplePeer({ initiator: true, trickle: false });
            
            peer.on('signal', d => {
                document.getElementById('codeA').value = JSON.stringify(d);
                document.getElementById('status').innerHTML = "Send the code above to Device B";
            });
            
            peer.on('connect', () => document.getElementById('status').innerHTML = "✅ Connected");
        }

        function startB() {
            const data = JSON.parse(document.getElementById('inputB').value);
            peer = new SimplePeer({ initiator: false, trickle: false });
            peer.signal(data);
            
            peer.on('signal', d => {
                document.getElementById('codeB').value = JSON.stringify(d);
                document.getElementById('status').innerHTML = "Send this reply code back to Device A";
            });
        }

        function finalConnect() {
            const data = JSON.parse(document.getElementById('finalInput').value);
            peer.signal(data);
        }

        async function send() {
            if (!peer || !peer.connected) return alert("Not connected");
            
            const file = document.getElementById('file').files[0];
            if (!file) return alert("No file");

            peer.send(JSON.stringify({name: file.name, size: file.size}));

            const chunk = 16*1024;
            for (let i = 0; i < file.size; i += chunk) {
                const part = file.slice(i, i + chunk);
                peer.send(await part.arrayBuffer());
            }
            document.getElementById('status').innerHTML = "File sent";
        }

        // Receive logic (basic)
        let chunks = [];
        peer?.on('data', d => {
            if (typeof d === 'string') chunks = [];
            else chunks.push(d);
        });
    </script>
</body>
</html>
