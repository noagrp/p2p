<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P (Serverless)</title>
    <style>
        body {
            font-family: monospace;
            background: #000;
            color: #0f0;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        .section {
            border: 1px solid #0f0;
            padding: 20px;
            margin: 15px 0;
            background: #111;
        }
        button {
            background: #111;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 12px 20px;
            margin: 5px;
            cursor: pointer;
            font-family: monospace;
        }
        button:hover { background: #0f0; color: #000; }
        input, textarea {
            width: 100%;
            background: #222;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 10px;
            margin: 8px 0;
            font-family: monospace;
        }
        #progress { margin-top: 10px; font-weight: bold; }
        .status { padding: 10px; background: #222; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>🔗 P2P (No Server)</h1>
    <p>Works on same WiFi or over internet. Open this page on both devices.</p>

    <div class="section">
        <h2>Step 1: Create Connection (Do this on first device)</h2>
        <button onclick="createOffer()">1. Create Offer</button>
        <textarea id="offerArea" rows="4" placeholder="Offer will appear here... Copy and send to second device"></textarea>
    </div>

    <div class="section">
        <h2>Step 2: Connect (Do this on second device)</h2>
        <textarea id="answerInput" rows="4" placeholder="Paste Offer from first device here"></textarea>
        <button onclick="createAnswer()">2. Create Answer</button>
        <textarea id="answerArea" rows="4" placeholder="Answer will appear here... Send back to first device"></textarea>
    </div>

    <div class="section">
        <h2>Step 3: Finalize Connection (Back on first device)</h2>
        <textarea id="finalAnswer" rows="3" placeholder="Paste Answer from second device here"></textarea>
        <button onclick="acceptAnswer()">3. Connect</button>
    </div>

    <div class="section">
        <h2>Send Files</h2>
        <input type="file" id="fileInput" multiple>
        <button onclick="sendFiles()">Send File(s)</button>
    </div>

    <div class="section">
        <h2>Status</h2>
        <div id="status" class="status">Ready - Create connection first</div>
        <div id="progress"></div>
        <div id="receivedFiles"></div>
    </div>

    <script src="https://unpkg.com/simple-peer@9/simplepeer.min.js"></script>

    <script>
        let peer = null;
        let isInitiator = false;
        let receivedBuffers = [];
        let incomingFileInfo = null;

        function updateStatus(msg, color = "#0f0") {
            const statusEl = document.getElementById('status');
            statusEl.innerHTML = msg;
            statusEl.style.color = color;
        }

        function createOffer() {
            isInitiator = true;
            peer = new SimplePeer({
                initiator: true,
                trickle: false,
                config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
            });

            peer.on('signal', data => {
                document.getElementById('offerArea').value = JSON.stringify(data);
                updateStatus('✅ Offer created. Copy and send to the other device.');
            });

            setupPeerEvents();
        }

        function createAnswer() {
            const offerData = JSON.parse(document.getElementById('answerInput').value);
            isInitiator = false;

            peer = new SimplePeer({
                initiator: false,
                trickle: false,
                config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
            });

            peer.signal(offerData);

            peer.on('signal', data => {
                document.getElementById('answerArea').value = JSON.stringify(data);
                updateStatus('✅ Answer created. Send it back to the first device.');
            });

            setupPeerEvents();
        }

        function acceptAnswer() {
            const answerData = JSON.parse(document.getElementById('finalAnswer').value);
            if (peer) peer.signal(answerData);
        }

        function setupPeerEvents() {
            peer.on('connect', () => {
                updateStatus('✅ Connected successfully! You can now send files.', '#0f0');
            });

            peer.on('data', handleIncomingData);

            peer.on('error', err => {
                updateStatus('Error: ' + err.message, '#f00');
            });
        }

        // Handle receiving files
        function handleIncomingData(data) {
            if (!incomingFileInfo) {
                // First message should be metadata
                incomingFileInfo = JSON.parse(new TextDecoder().decode(data));
                receivedBuffers = [];
                updateStatus(`Receiving: ${incomingFileInfo.name} (${(incomingFileInfo.size/1024/1024).toFixed(2)} MB)`);
                return;
            }

            receivedBuffers.push(data);

            const receivedSize = receivedBuffers.reduce((acc, buf) => acc + buf.byteLength, 0);
            const progress = Math.round((receivedSize / incomingFileInfo.size) * 100);
            
            document.getElementById('progress').innerHTML = `Receiving: ${progress}%`;

            if (receivedSize >= incomingFileInfo.size) {
                const blob = new Blob(receivedBuffers);
                const url = URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.href = url;
                link.download = incomingFileInfo.name;
                link.click();

                updateStatus(`✅ Received and downloaded: ${incomingFileInfo.name}`);
                incomingFileInfo = null;
                receivedBuffers = [];
            }
        }

        async function sendFiles() {
            if (!peer || !peer.connected) {
                alert("Not connected yet!");
                return;
            }

            const files = document.getElementById('fileInput').files;
            if (files.length === 0) return alert("Select a file first");

            for (let file of files) {
                updateStatus(`Sending: ${file.name}`);

                // Send metadata first
                const metadata = {
                    name: file.name,
                    size: file.size,
                    type: file.type
                };
                peer.send(JSON.stringify(metadata));

                const chunkSize = 16 * 1024; // 16KB
                let offset = 0;

                while (offset < file.size) {
                    const chunk = file.slice(offset, offset + chunkSize);
                    const buffer = await chunk.arrayBuffer();
                    peer.send(buffer);
                    offset += chunkSize;

                    const progress = Math.round((offset / file.size) * 100);
                    document.getElementById('progress').innerHTML = `Sending ${file.name}: ${progress}%`;
                }

                updateStatus(`✅ Finished sending: ${file.name}`);
            }
        }

        // Keyboard shortcut hint
        console.log("%cP2P File Transfer ready. Open on both devices.", "color: lime");
    </script>
</body>
</html>
